<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mobility App — Smart Integrated Car, Driver & Partner Services">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mobility App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Mobility App</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background-color: #F8FAFC !important;
      color: #0F172A;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Clean light autofill styling */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active,
    textarea:-webkit-autofill,
    textarea:-webkit-autofill:hover,
    textarea:-webkit-autofill:focus,
    select:-webkit-autofill,
    select:-webkit-autofill:hover,
    select:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #FFFFFF inset !important;
      -webkit-text-fill-color: #0F172A !important;
      caret-color: #0F172A !important;
      border: 1px solid #E2E8F0 !important;
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    input, select, textarea {
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      border: 1px solid #E2E8F0 !important;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94A3B8 !important;
    }

    input:focus, select:focus, textarea:focus {
      outline: none !important;
      border: 1.5px solid #10B981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) !important;
    }

    /* Flutter initial loading splash */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #F8FAFC;
      gap: 16px;
    }

    .logo-box {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top: 3px solid #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #loading h2 {
      color: #0F172A;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    #loading p {
      color: #64748B;
      font-size: 13px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-box">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
        <circle cx="7" cy="17" r="2"/>
        <path d="M9 17h6"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
    </div>
    <h2>Mobility App</h2>
    <p>Smart Integrated Car, Driver & Partner Services</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Open WhatsApp (popup) + redirect after 1.2s for guaranteed delivery
    function openWhatsAppUrl(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    function redirectToWhatsApp(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
      setTimeout(function() { window.location.href = url; }, 1200);
    }

    // Remove loading screen when Flutter first frame is rendered
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
